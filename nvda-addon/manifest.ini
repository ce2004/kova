name = kovaHelper
summary = "Kova Helper"
description = """Hands NVDA's speech, braille, beeps and sounds straight to Kova on this PC, so a PC controlling this one through Kova hears them at once. It only talks to Kova on this same PC and never uses the network. Kova installs and removes it; you can also remove it from NVDA's add-on store."""
author = "Conner Erwin"
url = https://github.com/ce2004/kova
version = 1.1.0
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
